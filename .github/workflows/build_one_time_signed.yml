name: Echo CI — one-time test signing

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack single Echo ZIP
        run: |
          set -euo pipefail
          test -f echo_combined.zip
          rm -rf echo_project echo_wear
          unzip -q echo_combined.zip
          test -d echo_project
          test -d echo_wear
          echo "Echo phone and Wear projects unpacked."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate one temporary signing key
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO:-}" ]; then
            echo "::error::ECHO secret is required."
            exit 1
          fi
          mkdir -p signing
          keytool -genkeypair \
            -v \
            -keystore signing/echo-test.jks \
            -storetype JKS \
            -alias echo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$ECHO" \
            -keypass "$ECHO" \
            -dname "CN=Echo Test, OU=Echo, O=Echo, L=Test, ST=Test, C=US"
          echo "Temporary signing key created for this workflow run."
          keytool -list -v \
            -keystore signing/echo-test.jks \
            -alias echo \
            -storepass "$ECHO" | grep -E "Alias name:|SHA256:"

      - name: Prepare the same temporary key for phone and watch
        run: |
          set -euo pipefail
          mkdir -p echo_project/app/build/generated
          mkdir -p echo_wear/app/build/generated
          cp signing/echo-test.jks echo_project/app/build/generated/echo-release.jks
          cp signing/echo-test.jks echo_wear/app/build/generated/echo-release.jks

      - name: Build phone release APK
        working-directory: echo_project
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI: ${{ secrets.GEMINI }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Build Wear OS release APK
        working-directory: echo_wear
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-phone-test-signed
          path: echo_project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-test-signed
          path: echo_wear/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
