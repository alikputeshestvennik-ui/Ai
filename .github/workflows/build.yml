name: Echo CI

on:
  push:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      has_wear: ${{ steps.detect.outputs.has_wear }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if [ -f "echo_project.zip" ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "echo_wear.zip" ]; then
            echo "has_wear=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wear=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "echo_project.zip found: ${{ steps.detect.outputs.has_project }}"
          echo "echo_wear.zip found:    ${{ steps.detect.outputs.has_wear }}"

  build-project:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_project.zip
        run: unzip -o echo_project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      - name: Restore permanent signing keystore
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ECHO_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p app/build/generated
          printf '%s' "$ECHO_KEYSTORE_BASE64" | base64 --decode > app/build/generated/echo-release.jks
          test -s app/build/generated/echo-release.jks

          echo "Signing certificate:"
          keytool -list -v \
            -keystore app/build/generated/echo-release.jks \
            -alias echo \
            -storepass "$ECHO" |
            grep -E "Alias name:|SHA256:"

      - name: Build release APK
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI: ${{ secrets.GEMINI }}
          ECHO_KEYSTORE_FILE: ${{ github.workspace }}/app/build/generated/echo-release.jks
        run: |
          set -e
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-wear:
    needs: detect
    if: needs.detect.outputs.has_wear == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo_wear
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_wear.zip
        working-directory: .
        run: unzip -o echo_wear.zip -d echo_wear

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      - name: Restore permanent signing keystore
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ECHO_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p app/build/generated
          printf '%s' "$ECHO_KEYSTORE_BASE64" | base64 --decode > app/build/generated/echo-release.jks
          test -s app/build/generated/echo-release.jks

          echo "Signing certificate:"
          keytool -list -v \
            -keystore app/build/generated/echo-release.jks \
            -alias echo \
            -storepass "$ECHO" |
            grep -E "Alias name:|SHA256:"

      - name: Build release APK
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_FILE: ${{ github.workspace }}/echo_wear/app/build/generated/echo-release.jks
        run: |
          set -e
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-release
          path: echo_wear/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
