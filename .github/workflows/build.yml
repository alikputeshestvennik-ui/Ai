name: Echo CI

on:
  push:
  workflow_dispatch:

jobs:
  # Проверяем, какие архивы реально закоммичены в корень репозитория.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      has_wear: ${{ steps.detect.outputs.has_wear }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if [ -f "echo_project.zip" ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "echo_wear.zip" ]; then
            echo "has_wear=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wear=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "echo_project.zip found: ${{ steps.detect.outputs.has_project }}"
          echo "echo_wear.zip found:    ${{ steps.detect.outputs.has_wear }}"

  # --- Телефонное приложение (Echo) ---
  build-project:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_project.zip
        run: unzip -o echo_project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      # Пытаемся восстановить keystore из предыдущей сборки или из secrets
      - name: Restore keystore
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: echo-keystore
          path: app/build/generated
          if_no_artifact_found: ignore

      - name: Generate or restore keystore
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/build/generated
          if [ -n "$ECHO_KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub secrets"
            echo "$ECHO_KEYSTORE_BASE64" | base64 -d > app/build/generated/echo-release.jks
          elif [ -f "app/build/generated/echo-release.jks" ]; then
            echo "Using keystore from previous build artifact"
          else
            echo "Generating new keystore (first build)"
            keytool -genkeypair -v \
              -keystore app/build/generated/echo-release.jks \
              -alias echo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ECHO" -keypass "$ECHO" \
              -dname "CN=Echo, OU=Echo, O=Echo, L=Unknown, S=Unknown, C=US"
          fi

      - name: Build release APK
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI: ${{ secrets.GEMINI }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Сохраняем keystore для будущих сборок (90 дней)
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-keystore
          path: app/build/generated/echo-release.jks
          retention-days: 90
          if-no-files-found: warn

  # --- Приложение для часов (Galaxy Watch) ---
  build-wear:
    needs: detect
    if: needs.detect.outputs.has_wear == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo_wear
    steps:
      - uses: actions/checkout@v4

      # FIX: архив лежит в корне репо, а все последующие шаги этого job'а
      # выполняются с working-directory: echo_wear — поэтому распаковываем
      # именно В echo_wear/, а не в корень ("-d .").
      - name: Unzip echo_wear.zip
        working-directory: .
        run: unzip -o echo_wear.zip -d echo_wear

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      # Пытаемся восстановить keystore из предыдущей сборки или из secrets
      - name: Restore keystore
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: echo-keystore
          path: app/build/generated
          if_no_artifact_found: ignore

      - name: Generate or restore keystore
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/build/generated
          if [ -n "$ECHO_KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub secrets"
            echo "$ECHO_KEYSTORE_BASE64" | base64 -d > app/build/generated/echo-release.jks
          elif [ -f "app/build/generated/echo-release.jks" ]; then
            echo "Using keystore from previous build artifact"
          else
            echo "Generating new keystore (first build)"
            keytool -genkeypair -v \
              -keystore app/build/generated/echo-release.jks \
              -alias echo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$ECHO" -keypass "$ECHO" \
              -dname "CN=Echo, OU=Echo, O=Echo, L=Unknown, S=Unknown, C=US"
          fi

      - name: Build release APK
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-release
          path: echo_wear/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
