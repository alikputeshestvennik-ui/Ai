name: Echo CI

on:
  push:
  workflow_dispatch:

jobs:
  # Проверяем, какие архивы реально закоммичены в корень репозитория.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      has_wear: ${{ steps.detect.outputs.has_wear }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if [ -f "echo_project.zip" ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "echo_wear.zip" ]; then
            echo "has_wear=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wear=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "echo_project.zip found: ${{ steps.detect.outputs.has_project }}"
          echo "echo_wear.zip found:    ${{ steps.detect.outputs.has_wear }}"

  # --- Телефонное приложение (Echo) ---
  # echo_project.zip распаковывается прямо в корень (внутри архива нет обёртки).
  build-project:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_project.zip
        run: unzip -o echo_project.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      # В архиве нет заранее сгенерированного keystore — создаём его на лету,
      # как описано в SIGNING.md: пароль = alias = секрет ECHO.
      # ВНИМАНИЕ: ключ не сохраняется между сборками, апдейт поверх старого APK не гарантирован.
      - name: Generate release keystore
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          mkdir -p app/build/generated
          keytool -genkeypair -v \
            -keystore app/build/generated/echo-release.jks \
            -alias echo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ECHO" -keypass "$ECHO" \
            -dname "CN=Echo, OU=Echo, O=Echo, L=Unknown, S=Unknown, C=US"

      - name: Build release APK
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI: ${{ secrets.GEMINI }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # --- Приложение для часов (Galaxy Watch) ---
  # echo_wear.zip уже содержит внутри себя папку echo_wear/, поэтому просто
  # распаковываем его в корень и работаем внутри получившейся папки.
  build-wear:
    needs: detect
    if: needs.detect.outputs.has_wear == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo_wear
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_wear.zip
        working-directory: .
        run: unzip -o echo_wear.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        run: chmod +x gradlew || true

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-debug
          path: echo_wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
