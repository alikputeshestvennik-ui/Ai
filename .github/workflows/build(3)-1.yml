name: Echo CI

on:
  push:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_project: ${{ steps.detect.outputs.has_project }}
      has_wear: ${{ steps.detect.outputs.has_wear }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f "echo_project.zip" ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "echo_wear.zip" ]; then
            echo "has_wear=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wear=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summary
        run: |
          echo "echo_project.zip found: ${{ steps.detect.outputs.has_project }}"
          echo "echo_wear.zip found:    ${{ steps.detect.outputs.has_wear }}"

  build-project:
    needs: detect
    if: needs.detect.outputs.has_project == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_project.zip
        run: unzip -o echo_project.zip -d echo_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        working-directory: echo_project
        run: chmod +x gradlew || true

      - name: Restore permanent signing keystore
        working-directory: echo_project
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ECHO_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p app/build/generated
          printf '%s' "$ECHO_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > app/build/generated/echo-release.jks
          test -s app/build/generated/echo-release.jks

          echo "Checking signing certificate..."
          keytool -list -v \
            -keystore app/build/generated/echo-release.jks \
            -alias echo \
            -storepass "$ECHO" \
            | grep -E "Alias name:|SHA256:"

      - name: Verify private key password
        working-directory: echo_project
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          set -euo pipefail
          cat > /tmp/VerifyKey.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifyKey {
            public static void main(String[] args) throws Exception {
              String file = args[0];
              char[] password = System.getenv("ECHO").toCharArray();
              KeyStore ks = KeyStore.getInstance("JKS");
              try (FileInputStream in = new FileInputStream(file)) {
                ks.load(in, password);
              }
              Key key = ks.getKey("echo", password);
              if (key == null) throw new IllegalStateException("Alias echo has no key");
              System.out.println("Private key recovered successfully with ECHO.");
            }
          }
          JAVA
          javac /tmp/VerifyKey.java
          java -cp /tmp VerifyKey "$GITHUB_WORKSPACE/echo_project/app/build/generated/echo-release.jks"

      - name: Build release APK
        working-directory: echo_project
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI: ${{ secrets.GEMINI }}
          ECHO_KEYSTORE_FILE: ${{ github.workspace }}/echo_project/app/build/generated/echo-release.jks
        run: |
          set -e
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-app-release
          path: echo_project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-wear:
    needs: detect
    if: needs.detect.outputs.has_wear == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip echo_wear.zip
        run: unzip -o echo_wear.zip -d echo_wear

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute to gradlew
        working-directory: echo_wear
        run: chmod +x gradlew || true

      - name: Restore permanent signing keystore
        working-directory: echo_wear
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ECHO_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ECHO_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p app/build/generated
          printf '%s' "$ECHO_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > app/build/generated/echo-release.jks
          test -s app/build/generated/echo-release.jks

          echo "Checking signing certificate..."
          keytool -list -v \
            -keystore app/build/generated/echo-release.jks \
            -alias echo \
            -storepass "$ECHO" \
            | grep -E "Alias name:|SHA256:"

      - name: Verify private key password
        working-directory: echo_wear
        env:
          ECHO: ${{ secrets.ECHO }}
        run: |
          set -euo pipefail
          cat > /tmp/VerifyKey.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public class VerifyKey {
            public static void main(String[] args) throws Exception {
              String file = args[0];
              char[] password = System.getenv("ECHO").toCharArray();
              KeyStore ks = KeyStore.getInstance("JKS");
              try (FileInputStream in = new FileInputStream(file)) {
                ks.load(in, password);
              }
              Key key = ks.getKey("echo", password);
              if (key == null) throw new IllegalStateException("Alias echo has no key");
              System.out.println("Private key recovered successfully with ECHO.");
            }
          }
          JAVA
          javac /tmp/VerifyKey.java
          java -cp /tmp VerifyKey "$GITHUB_WORKSPACE/echo_wear/app/build/generated/echo-release.jks"

      - name: Build release APK
        working-directory: echo_wear
        env:
          ECHO: ${{ secrets.ECHO }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO }}
          ECHO_KEYSTORE_FILE: ${{ github.workspace }}/echo_wear/app/build/generated/echo-release.jks
        run: |
          set -e
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-wear-release
          path: echo_wear/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
