name: Build Echo signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root"
            exit 1
          fi
          mkdir -p .echo-unpacked
          unzip -q "$ZIP" -d .echo-unpacked

          if [ -f .echo-unpacked/settings.gradle.kts ] || [ -f .echo-unpacked/settings.gradle ]; then
            cp -a .echo-unpacked/. .
          else
            PROJECT_DIR="$(find .echo-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$PROJECT_DIR" ] && { [ -f "$PROJECT_DIR/settings.gradle.kts" ] || [ -f "$PROJECT_DIR/settings.gradle" ]; }; then
              cp -a "$PROJECT_DIR"/. .
            else
              echo "Could not find Android Gradle project in ZIP"
              exit 1
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing keystore
        env:
          ECHO: ${{ secrets.ECHO }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ECHO" || { echo "ECHO secret is missing"; exit 1; }

          mkdir -p app/build/generated

          keytool -genkeypair             -alias echo             -keyalg RSA             -keysize 2048             -validity 10000             -keystore app/build/generated/echo-release.jks             -storepass "$ECHO"             -keypass "$ECHO"             -dname "CN=Echo, OU=Echo, O=Echo, L=Local, ST=Local, C=PL"             -noprompt

      - name: Build signed release APK
        env:
          ECHO: ${{ secrets.ECHO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
