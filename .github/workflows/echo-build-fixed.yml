name: Build Echo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI }}
      ECHO_PASSWORD: ${{ secrets.ECHO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack Echo project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p .echo_unpack
          unzip -q "$ZIP" -d .echo_unpack
          cp -a .echo_unpack/. .
          rm -rf .echo_unpack

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Gradle wrapper if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Prepare signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ECHO_PASSWORD:-}" ]; then
            echo "ECHO secret is missing."
            exit 1
          fi
          keytool -genkeypair \
            -keystore echo-release.jks \
            -storepass "$ECHO_PASSWORD" \
            -keypass "$ECHO_PASSWORD" \
            -alias echo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Echo, OU=Echo, O=Echo, L=Local, ST=Local, C=PL" \
            -noprompt

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          ECHO="$ECHO_PASSWORD" ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
